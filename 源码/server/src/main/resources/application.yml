server:
  port: 8080

spring:
  application:
    name: gjp-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/gjp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ''
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 120MB
  flyway:
    enabled: true
    encoding: UTF-8
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    # 已有 gjp 库第一次启动：标成 V1，只跑 V2+。禁止用 schema.sql 对已有库建表。

mybatis:
  configuration:
    # 数据库 record_date 这类下划线字段自动映射到 Java 的 recordDate
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，方便排查统计口径问题；验收演示时可改成 NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  type-aliases-package: com.gjp.entity

gjp:
  import:
    upload-dir: ${GJP_IMPORT_DIR:./uploads/import}
    max-files: 10
  dify:
    # 本地 Dify（docker-nginx 映射 80）的 API 前缀。密钥只从环境变量读，不要写进仓库。
    base-url: ${DIFY_BASE_URL:http://127.0.0.1/v1}
    api-key: ${DIFY_API_KEY:}
    # 对应工作室应用「管家婆账单导入」工作流；对话型智能体才用 chat
    mode: ${DIFY_MODE:workflow}
    user: ${DIFY_USER:gjp}
    file-var: bill_file
    text-var: text_content
    categories-var: categories
    timeout-seconds: 180
    # 智能分析 / 账单搜索各自一把 Key，不要复用 DIFY_API_KEY
    analysis-api-key: ${DIFY_ANALYSIS_API_KEY:}
    analysis-base-url: ${DIFY_ANALYSIS_BASE_URL:}
    analysis-timeout-seconds: 60
    search-api-key: ${DIFY_SEARCH_API_KEY:}
    search-base-url: ${DIFY_SEARCH_BASE_URL:}
    search-timeout-seconds: 60
  qwen:
    base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${DASHSCOPE_API_KEY:}
    text-model: ${QWEN_TEXT_MODEL:qwen-plus}
    vision-model: ${QWEN_VISION_MODEL:qwen-vl-plus}
    timeout-seconds: 60

logging:
  level:
    com.gjp: debug

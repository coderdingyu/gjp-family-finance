app:
  description: 从图片、PDF 或 Excel 表格文本中抽出家庭收支流水 JSON。只解析不写库。
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: 管家婆账单导入
  use_icon_as_answer_icon: false

    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
      id: 1788327900675-source-1788328000001-target
      source: '1788327900675'
      sourceHandle: source
      target: '1788328000001'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 管家婆导入入口
        selected: false
        title: 用户输入
        type: start
        variables:
        - allowed_file_extensions: []
          allowed_file_types:
          - image
          - document
          allowed_file_upload_methods:
          - local_file
          - remote_url
          label: 账单文件
          max_length: 48
          required: false
          type: file
          variable: bill_file
        - label: 表格文本
          max_length: 80000
          required: false
          type: paragraph
          variable: text_content
        - label: 分类名单
          max_length: 20000
          required: false
          type: paragraph
          variable: categories
      height: 189
      id: '1788327747622'
      position:
        x: 80
        y: 240
      positionAbsolute:
        x: 80
        y: 240
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 抽出流水 JSON
        model:
          completion_params:
            temperature: 0.6
          mode: chat
          name: qwen3.8-max
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: sys
          role: system
          text: "你是「管家婆」家庭收支管理系统的账单解析智能体。\n用户会给你一张图片、一份 PDF，或一段从 Excel/CSV 抽出来的表格文本。\n\
            你的任务是抽出其中的收支流水。文件里可能有几十上百笔，必须尽量逐笔抽取，不要合并、不要只给汇总。\n\n只输出一个 JSON 对象，不要 Markdown，不要解释。格式：\n\
            {\n  \"relevant\": true,\n  \"reason\": \"\",\n  \"records\": [\n    {\n\
            \      \"type\": 2,\n      \"amount\": 28.50,\n      \"recordDate\": \"\
            2026-08-01\",\n      \"categoryName\": \"正餐\",\n      \"merchant\": \"\
            海底捞\",\n      \"area\": \"\",\n      \"payMethod\": \"微信\",\n      \"\
            isGift\": 0,\n      \"remark\": \"\"\n    }\n  ]\n}\n\n规则：\n1. type：1=收入，2=支出。看不出时按支出。\n\
            2. amount 必须是大于 0 的数字。\n3. recordDate 用 YYYY-MM-DD。没有年份时用当年；完全没有日期则跳过该行。\n\
            4. categoryName 必须从用户提供的分类名单里选一个最接近的末级分类，不要自造分类。\n5. payMethod 只能是：现金\
            \ / 微信 / 支付宝 / 银行卡 / 其他，不确定就留空。\n6. isGift：礼金、红包、随份子、请客送礼为 1，否则 0。\n7.\
            \ 如果文件与家庭账单无关（风景照、论文、合同、纯文字小说、空白表等）：\n   返回 {\"relevant\": false, \"reason\"\
            : \"一句话说明为什么不是账单\", \"records\": []}\n8. 能看懂一部分就抽一部分；完全看不懂按无关文件处理。\n9.\
            \ 商家、片区、备注、分类名一律用中文原文，禁止翻译成英文。categoryName 必须是分类名单里的中文末级名（例如正餐、咖啡奶茶），不要写\
            \ Dinner / Coffee。\n"
        - id: user
          role: user
          text: '可选末级分类名单：

            {{#1788327747622.categories#}}


            以下是从表格文件抽出的文本（可能为空，此时请识别附件账单）：

            {{#1788327747622.text_content#}}


            请识别附件或上述文本中的账单。如果内容与家庭收支无关，按无关文件返回。'
        selected: true
        title: 账单解析
        type: llm
        vision:
          configs:
            detail: high
            variable_selector:
            - '1788327747622'
            - bill_file
          enabled: true
      height: 116
      id: '1788327900675'
      position:
        x: 400

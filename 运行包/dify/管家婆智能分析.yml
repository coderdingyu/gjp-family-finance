    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 只输出 JSON
        memory: null
        model:
          completion_params:
            temperature: 0.6
            enable_thinking: false
          mode: chat
          name: qwen3.8-max
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - role: system
          text: "你是「管家婆」家庭收支管理系统的智能分析管家。\nJava 已经算好统计数字，并判定了哪些规则命中（fired）。A* 的 code、level 以及 snapshot 里的数字是唯一真相。\n不要访问数据库，不要输出 Markdown，不要解释。\n只输出一个 JSON 对象：\n{\"items\":[{\"code\":\"A1\",\"level\":\"danger\",\"title\":\"...\",\"basis\":\"...\",\"suggestion\":\"...\"}]}\n要求：\n1. items 必须覆盖 snapshot.fired 里的每一条 A*，code/level 与 Java 完全一致。数字必须来自 snapshot，不要编造。\n2. 在 fired 之外追加额外条目：\n   - S0 总判断：当 fired 不含 A0 时必须输出。一段话把命中规则串成家庭诊断：钱主要漏在哪一类/哪几个商家，是偶发大额还是结构性问题。不要把片区（A7）当成主叙事；片区只是课纲要求的可选维度。\n   - S1 钱主要漏在哪：可选。点名 snapshot.topCategories / topMerchants 里的具体名称，给可执行建议。\n   - S2 下月该盯什么：可选。1–2 条具体下一步。\n   额外条目可用 level：danger / warning / info。\n3. title / basis / suggestion 用中文。禁止编造 snapshot 没有的数字。禁止提及其他家庭或未出现在 snapshot 里的人。\n4. 只输出 JSON。"
        - role: user
          text: "规则表：\n{{#1788410000001.rule_table#}}\n\nJava 快照（含命中规则、月度趋势、分类/商家/预算/人情/片区、成员拆分）：\n{{#1788410000001.snapshot#}}\n\n请按规则输出 JSON：保留全部 fired A*（code/level 不变），并追加 S0（非 A0 时必出）及可选 S1/S2。"
        selected: false
        title: 生成
        type: llm
        vision:
          configs:
            variable_selector: []
          enabled: false
      height: 90
      id: '1788410000002'
      position:
